<!-- Simple icon for Smart Student Planner -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
>
  <!-- Blue background -->
  <rect
    width="64"
    height="64"
    rx="12"
    fill="#2563eb"
  />

  <!-- Calendar -->
  <rect
    x="14"
    y="18"
    width="36"
    height="32"
    rx="5"
    fill="white"
  />

  <!-- Calendar top -->
  <rect
    x="14"
    y="25"
    width="36"
    height="4"
    fill="#2563eb"
  />

  <!-- Check mark -->
  <path
    d="M24 39 L30 44 L41 33"
    fill="none"
    stroke="#2563eb"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>